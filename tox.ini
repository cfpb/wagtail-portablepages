[tox]
skipsdist=True
envlist=
    lint,
    python{3.8,3.12}-django{4.2}-wagtail{6.1},
    coverage

[testenv]
install_command=pip install -e ".[testing]" -U {opts} {packages}
commands=
    python -b -m coverage run --parallel-mode --source='portablepages' {envbindir}/django-admin test {posargs}
setenv=
    DJANGO_SETTINGS_MODULE=portablepages.tests.settings
basepython=
    python3.8: python3.8
    python3.12: python3.12
deps=
    django4.2:  Django>=4.2,<5
    wagtail6.1: wagtail>=6.1,<6.2

[testenv:lint]
basepython=python3.12
deps=
    ruff
    mypy
    bandit
commands=
    ruff format --check
    ruff check portablepages
    mypy portablepages
    bandit -c "pyproject.toml" -r portablepages

[testenv:coverage]
basepython=python3.12
deps=
    coverage[toml]
    diff_cover
commands=
    coverage combine
    coverage report -m
    coverage xml
    diff-cover coverage.xml --compare-branch=origin/main --fail-under=100

[testenv:interactive]
basepython=python3.12
deps=
    Django>=4.2,<4.3
setenv=
    DJANGO_SETTINGS_MODULE=portablepages.tests.settings
    INTERACTIVE=1
commands_pre=
    {envbindir}/django-admin makemigrations
    {envbindir}/django-admin migrate
    {envbindir}/django-admin shell -c "from django.contrib.auth.models import User;(not User.objects.filter(username='admin').exists()) and User.objects.create_superuser('admin', 'super@example.com', 'changeme')"
commands=
    {posargs:{envbindir}/django-admin runserver 0.0.0.0:8000}
